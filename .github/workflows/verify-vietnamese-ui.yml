name: Verify built-in Chinese and Vietnamese UI locales

on:
  push:
    branches: ['feature/vi-vn-non-invasive-localization']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vietnamese-ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 'Syntax: original and localization scripts'
        run: |
          node --check public/js/i18n/locales/zh-CN.js
          node --check public/js/i18n/locales/vi-VN.js
          node --check public/js/i18n/i18n.js
          node --check desktop/preload.js
          node --check desktop/main.js
          node --check desktop/github-vn-auto-update.js
          node --check public/js/modules/05-playback/07-search.js
          node --check public/js/modules/05-playback/14-player-controls.js
          node --check public/js/modules/07-fx/05-fx-panel-performance.js
          node --check public/js/index-loader.js
          node --check public/js/modules/11-main-loop.js
          node --check public/js/modules/05-playback/08-audio-graph-controls.js
      - name: Vietnamese subtitle syntax and service tests
        run: |
          node --check lyric-translation-service.js
          node --check public/js/modules/06-lyrics/00a-localized-lyric-translation.js
          node --check server.js
          node --check public/js/modules/05-playback/06-track-detail-lyrics-actions.js
          node --test tests/vi-lyrics-translation.test.js
      - name: Locale catalogs, stable IDs, in-app switching and audio-safe rendering
        run: node --test tests/vi-i18n.test.js tests/vi-dynamic-ui.test.js tests/vi-direct-login.test.js tests/vi-queue-localization.test.js
      - name: Vietnamese layout and interactive label regression tests
        run: node --test tests/vi-complete-ui.test.js
      - name: GitHub release update validation tests
        run: node --test tests/github-vn-auto-update.test.js
      - name: Original Mineradio playback UI regression tests
        run: |
          node --test tests/playback-audio-graph-recovery.test.js
          node --test tests/playback-source-fallback-transaction.test.js
          node --test tests/playback-single-repeat-loop.test.js
      - name: Verify native language catalogs and untouched shader bundle
        run: |
          test -f public/js/modules/02-visual/00-pointer-cover-particles.js
          test -f public/js/modules/03-beat/06-sonic-audio-monitor.js
          test -f public/sonic-topography-preset.js
          test -f public/sonic-workshop-preset.js
          grep -q 'js/i18n/i18n.js' public/index.html
          grep -q 'js/i18n/i18n.js' public/desktop-lyrics.html
          grep -q 'getUiLanguage' desktop/preload.js
          grep -q 'mineradio-ui-language-set' desktop/main.js
